<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Footage search · TrackRAG-Gulf</title>
  <link rel="stylesheet" href="/app.css"><script type="module" src="/footage.js"></script>
</head>
<body>
  <header class="top"><span class="brand">TrackRAG<span>Gulf</span></span><a href="/">Passenger drop-off</a><span class="top-label">Search footage</span></header>
  <main>
    <div class="intro"><h1>Search road footage</h1><p>Search the predicted tracks and original frames up to the selected moment.</p></div>
    <form class="card review-form" id="search">
      <label for="scene">Recording and latest frame</label><select id="scene" required></select>
      <label for="question">Footage question</label><textarea id="question" rows="2" maxlength="4096" required></textarea>
      <label for="answer-mode">Answer mode</label><select id="answer-mode">
        <option value="local">Find evidence locally</option><option value="gemini">Ask Gemini using privacy-processed evidence</option>
      </select>
      <button class="primary" id="go">Search footage</button>
    </form>
    <p id="progress" role="status" aria-live="polite"></p><section id="results" aria-label="Answer and evidence"></section>
  </main>
</body></html>
