name: Task 5 checks

on:
  pull_request:
    paths:
      - 'trackrag/**'
      - 'evaluation/**'
      - 'tests/**'
      - 'requirements-review.txt'
      - '.github/workflows/task5-tests.yml'
  push:
    branches: [main]
    paths:
      - 'trackrag/**'
      - 'evaluation/**'
      - 'tests/**'
      - 'requirements-review.txt'
      - '.github/workflows/task5-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-review.txt
      - run: python -m pip install -r requirements-review.txt
      - run: python -m unittest discover -s tests -p "test_review*.py" -v
      - run: python -m unittest discover -s tests -p "test_score*.py" -v
      - run: python -m trackrag --help
      - run: python -m evaluation --help
