name: Task 5 checks

on:
  pull_request:
    paths:
      - 'trackrag/**'
      - 'evaluation/**'
      - 'tests/**'
      - 'tools/**'
      - 'requirements-review.txt'
      - 'requirements-integration.txt'
      - 'requirements-hosted.txt'
      - 'requirements-grounding*.txt'
      - 'configs/dropoff/**'
      - 'experiments/dropoff/**'
      - 'notebooks/dropoff_gpu_pilot.ipynb'
      - 'annotations/**'
      - '.github/workflows/task5-tests.yml'
      - '.gitattributes'
  push:
    branches: [main]
    paths:
      - 'trackrag/**'
      - 'evaluation/**'
      - 'tests/**'
      - 'tools/**'
      - 'requirements-review.txt'
      - 'requirements-integration.txt'
      - 'requirements-hosted.txt'
      - 'requirements-grounding*.txt'
      - 'configs/dropoff/**'
      - 'experiments/dropoff/**'
      - 'notebooks/dropoff_gpu_pilot.ipynb'
      - 'annotations/**'
      - '.github/workflows/task5-tests.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-hosted.txt
      - run: python -m pip install -r requirements-hosted.txt
      - run: python -m unittest discover -s tests -p "test_review*.py" -v
      - run: python -m unittest discover -s tests -p "test_score*.py" -v
      - run: python -m pytest tests -q
      - run: python -m trackrag --help
      - run: python -m evaluation --help
      - run: python -m evaluation compare --help
      - run: python -m evaluation review-template --help
      - run: python -m evaluation verify-retrieval --help
      - run: python -m evaluation prepare-annotations --help
      - run: python -m tools.dropoff_fit_local --help
      - run: python -m tools.dropoff_predict --help
      - run: python -m tools.dropoff_prepare_streamed_model --help
